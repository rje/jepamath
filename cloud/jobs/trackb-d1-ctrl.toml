# D1 ctrl arm (docs/2026-11-27-d1-number-size-finetune.md, pre-registered 27 Nov): 10k-step continuation of
# objlabel-100k ckpt_100000 with half the samples from new matched two-transfer clips, add clips concordant only (matched control).
# The two D1 arms differ only in --mix-data.
[job]
name = "trackb-d1-ctrl"
command = "python -m jepatrain.train --out $RUN_DIR --data $DATA/v4b_128s --mix-data $DATA/d1_ctrl_128 --mix-frac 0.5 --init-ckpt $DATA/init_objlabel100k/ckpt_100000.pt --heldout $DATA/heldout_v4b_128/v4b_triples2000_128.pt --res 128 --duty 1.0 --power-ceiling 5000 --workers 12 --auto-resume --loss l2 --pool-weight 1.0 --change-weight 50 --p-prefix 0.8 --steps 10000 --warmup 500 --lr 1e-4 --eval-every 5000 --mask-weight 0.5 --seed 0"
setup = ["pip install -q webdataset scikit-learn pyarrow pyyaml pydantic"]
progress_regex = '"step": (\d+)'
rolling = "ckpt_*.pt"
keep_rolling = 2

[[data]]
remote = "data/v4b_128s"
local = "v4b_128s"

[[data]]
remote = "data/heldout_v4b_128"
local = "heldout_v4b_128"

[[data]]
remote = "data/d1_ctrl_128"
local = "d1_ctrl_128"

[[data]]
remote = "data/init_objlabel100k"
local = "init_objlabel100k"

[machine]
# small model (17.8M params, ~13 GB at batch 32); the data loader wants CPU cores, the held-out set ~14 GB RAM
# RTX PRO 6000 (Blackwell, 96 GB): ~5090 speed on datacenter-grade hosts. Five 5090 bids in a row were lost
# within minutes on 21 Nov; Max-Q (300 W) left out as slower
gpus = ["RTX PRO 6000 S", "RTX PRO 6000 WS"]
max_price_per_gpu = 1.70   # 27 Nov: on-demand after a preemption at step 20k at the $1.00 interruptible cap
# bid high (floor x 2, capped at $1): we pay the bid, and a low bid was preempted within minutes (21-22 Nov)
bid_multiplier = 2.0
# Blackwell (5090, PRO 6000) needs a CUDA 12.8 PyTorch build (sm_120) and a host driver that supports it
image = "pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime"
min_cuda = 12.8
# rank by expected episode cost: 60 ckpts x 0.27 GB + 13 weights x 0.13 GB synced out per 30k-step run
episode_hours = 0.6   # 10k steps (~15 min) + data pull + 3 evals
upload_gb = 2.0
interruptible = false
min_reliability = 0.98
min_disk_gb = 80
min_gpu_ram_gb = 20
min_cpu_cores = 16
min_ram_gb = 48
min_inet_down_mbps = 500

[budget]
max_spend = 3.0   # D1: $3 cap per arm (approved plan ~$15-18 total)
max_hours = 2

[watch]
setup_grace_min = 40
stall_min = 20
poll_s = 60
max_failures = 4   # boot hangs cost ~$0.20 each and were frequent on 23 Nov
min_steps_per_min = 300   # normal hosts run 650-1300 steps/min; 27 Nov slow hosts ran ~80
