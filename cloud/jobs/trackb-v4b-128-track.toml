# S2 attribution (data x grouping): the label-free tracking grouper (track_seg, pixels only; data v4b_128t) on v4b data,
# otherwise identical to trackb-v4b-128-mask05b (object-label) and trackb-v4b-128-cw50-only (plain).
[job]
name = "trackb-v4b-128-track"
command = "python -m jepatrain.train --out $RUN_DIR --data $DATA/v4b_128t --heldout $DATA/heldout_v4b_128/v4b_triples2000_128.pt --res 128 --duty 1.0 --power-ceiling 5000 --workers 12 --auto-resume --loss l2 --pool-weight 1.0 --change-weight 50 --p-prefix 0.5 --mask-weight 0.5 && python scripts/locate_surprise.py $RUN_DIR --weights weights_015000.pt weights_030000.pt --heldout $DATA/heldout_v4b_128/v4b_triples2000_128.pt --out $RUN_DIR/locate --device cuda && python scripts/visible_drop.py $RUN_DIR --weights weights_015000.pt weights_030000.pt --data $DATA/v4_vistest --n 400 --out $RUN_DIR/visdrop --device cuda"
setup = ["pip install -q webdataset scikit-learn pyarrow pyyaml pydantic"]
progress_regex = '"step": (\d+)'
rolling = "ckpt_*.pt"
keep_rolling = 2

[[data]]
remote = "data/v4b_128t"
local = "v4b_128t"

[[data]]
remote = "data/heldout_v4b_128"
local = "heldout_v4b_128"

[[data]]
remote = "data/v4_vistest"
local = "v4_vistest"

[machine]
gpus = ["RTX PRO 6000 S", "RTX PRO 6000 WS"]
max_price_per_gpu = 1.00
bid_multiplier = 2.0
image = "pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime"
min_cuda = 12.8
episode_hours = 1.0   # 30k steps at ~370 clips/s: ~45 min + evals
upload_gb = 18.0
interruptible = true
min_reliability = 0.98
min_disk_gb = 80
min_gpu_ram_gb = 20
min_cpu_cores = 16
min_ram_gb = 48
min_inet_down_mbps = 500

[budget]
max_spend = 3.0   # the first attempt (trackb-v4b-128-mask05) crashed for $0.70
max_hours = 3

[watch]
setup_grace_min = 40
stall_min = 20
poll_s = 60
max_failures = 2
