# Unit test for the learner: every clip shows one large object carried from the hopper and dropped into a
# near-empty box, in full view. If a model trained on this cannot predict where the dropped object lands,
# the problem is the model/objective, not scene complexity or occlusion.
visibility_modes: [visible]
visibility_weights: [1.0]
use_screen: true
count_range: [0, 1]
final_range: [1, 2]
k_range: [1, 1]
ops: [add]
op_weights: [1.0]
shuffle_prob: 0.0
radius_range: [0.045, 0.06]
pile_h: 0.14
scene:
  box_inner: [0.28, 0.32]
  hopper_inner: [0.25, 0.28]
  cam_distance: [0.85, 1.25]
