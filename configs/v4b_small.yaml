# v4b: v4 with the area control working at counts 0-3 (wider radius range, areas matched at count 2).
# v4: the classic small-number paradigm (Wynn 1992: 1+1, 2-1). Counts 0-3, one object moved per clip,
# objects ~2x v3's radius so a hidden addition/deletion covers many tokens. Visible/mixed/occluded as v3.
visibility_modes: [occluded, visible, mixed]
visibility_weights: [0.34, 0.33, 0.33]
count_range: [0, 3]
final_range: [0, 3]
k_range: [1, 1]
radius_range: [0.035, 0.065]
area_ref_count: 2
pile_h: 0.14
scene:
  box_inner: [0.28, 0.32]
  hopper_inner: [0.25, 0.28]
  cam_distance: [0.85, 1.25]
