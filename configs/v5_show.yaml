# v5 "show": the holding-up stage before counting. As v5_small, but objects glide one at a time while the rest
# stay still (glide_mode sequential): the clean common-fate cue of an object being shown, so label-free motion
# groups are whole single objects. No screen (visible only), which leaves a longer glide phase.
visibility_modes: [visible]
visibility_weights: [1.0]
use_screen: false
count_range: [0, 3]
final_range: [0, 3]
k_range: [1, 1]
max_transfers: 1
radius_range: [0.035, 0.065]
area_ref_count: 2
pile_h: 0.14
glide_phase_s: [3.5, 4.2]
glide_prob: 1.0
glide_s: [0.5, 1.0]
glide_mode: sequential
scene:
  box_inner: [0.28, 0.32]
  hopper_inner: [0.25, 0.28]
  cam_distance: [0.85, 1.25]
