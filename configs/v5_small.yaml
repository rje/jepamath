# v5: v4b plus a glide phase for stage 0 (individuation). Before the first action, objects in view move on
# their own to random points in their tray, several at once (common fate: an object's parts move together,
# different objects move independently). One transfer per clip (max_transfers 1) leaves room for the phase
# in the 8 s clip; mixed visibility needs >= 2 transfers, so occluded/visible only. Twins stay
# pixel-identical up to the violation (glides end before the screen rises).
visibility_modes: [occluded, visible]
visibility_weights: [0.5, 0.5]
count_range: [0, 3]
final_range: [0, 3]
k_range: [1, 1]
max_transfers: 1
radius_range: [0.035, 0.065]
area_ref_count: 2
pile_h: 0.14
glide_phase_s: [1.5, 2.2]
glide_prob: 1.0
glide_s: [0.7, 1.5]
scene:
  box_inner: [0.28, 0.32]
  hopper_inner: [0.25, 0.28]
  cam_distance: [0.85, 1.25]
