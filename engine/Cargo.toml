[package]
name = "jepamath_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "jepamath_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rapier3d = { version = "0.36", features = ["enhanced-determinism"] }
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
opt-level = 3

[package.metadata.maturin]
features = ["python"]
